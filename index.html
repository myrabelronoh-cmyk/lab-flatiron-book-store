<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f4ed">
    <title>Page &amp; Pine | Bookstore Catalog</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#" aria-label="Page and Pine home">Page &amp; Pine</a>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">Find your next favorite</p>
        <h1 id="page-title">The Bookshop Catalog</h1>
        <p class="description">Thoughtful stories, timeless classics, and new worlds to get lost in. Browse the shelves and discover a book to take home.</p>
      </section>

      <section aria-labelledby="catalog-title">
        <div class="catalog-heading">
          <h2 id="catalog-title">On our shelves</h2>
          <span class="book-count" id="book-count" aria-live="polite"></span>
        </div>
        <div class="book-grid" id="book-grid"></div>
      </section>
    </main>

    <footer>Page &amp; Pine Bookshop · A good book is always in season.</footer>
  </body>
</html>
